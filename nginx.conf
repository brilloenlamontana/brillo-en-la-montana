server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME extendidos para modelos 3D y WebAssembly
    types {
        include /etc/nginx/mime.types;
        model/gltf+json             gltf;
        model/gltf-binary           glb;
        application/wasm            wasm;
        application/octet-stream    bin;
    }

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        model/gltf+json;

    # Encabezados de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache prolongado para archivos estáticos inmutables generados por Vite
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache para modelos 3D, imágenes, fuentes y archivos de sonido
    location ~* \.(?:glb|gltf|bin|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|eot|mp3|wav|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # No cachear index.html para asegurar actualizaciones inmediatas de la SPA
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Fallback para React Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página de error por defecto
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
