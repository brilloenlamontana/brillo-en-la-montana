server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip (/etc/nginx/nginx.conf ya incluye /etc/nginx/mime.types con wasm y bin)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        model/gltf+json;

    # Encabezados de seguridad base
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache prolongado para bundles inmutables con hash generados por Vite
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Modelos binarios glTF (.glb)
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=2592000";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Modelos JSON glTF (.gltf)
    location ~* \.gltf$ {
        types { model/gltf+json gltf; }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=2592000";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Cache para decodificador Draco (.wasm/.js), imágenes, fuentes y audio
    location ~* \.(?:wasm|bin|js|css|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|eot|mp3|wav|ogg)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=2592000";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # El service worker se consulta siempre: así una versión nueva llega de inmediato
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # No cachear index.html para asegurar actualizaciones inmediatas de la SPA
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fallback para React Router SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página de error por defecto
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
