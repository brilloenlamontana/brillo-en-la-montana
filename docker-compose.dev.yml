name: brillo-en-la-montana

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: brillo-en-la-montana:dev
    container_name: brillo-en-la-montana-dev
    ports:
      - "${DEV_PORT:-5174}:5174"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - ./.oxlintrc.json:/app/.oxlintrc.json
    restart: unless-stopped

