services:
  # ============================================================================
  # Servicio de Desarrollo con Hot Reload (Predeterminado)
  # Sincronización en vivo: cada vez que guardas código, se actualiza solo.
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: brillo-en-la-montana:dev
    container_name: brillo-en-la-montana-dev
    ports:
      - "${DEV_PORT:-5174}:5174"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --port 5174
    restart: unless-stopped

  # ============================================================================
  # Servicio de Producción (Opcional)
  # Para ejecutar: docker compose --profile prod up --build app-prod
  # ============================================================================
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_ADMIN_EMAILS: ${VITE_ADMIN_EMAILS}
    image: brillo-en-la-montana:prod
    container_name: brillo-en-la-montana-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    profiles:
      - prod
